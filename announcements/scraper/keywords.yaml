# search_terms: queried on the WordPress sites (KNA, Kilimo, Presidency) to find candidates.
#   Keep them BROAD: WordPress search matches every word as a substring of title/content,
#   so "crop" also finds "crops", "fertili" finds fertiliser AND fertilizer, and
#   "food security" finds "food insecurity". Fewer terms = fewer requests.
# tags: the full list. Every kept announcement lists the tags (and groups) found in its text.
#   Matching is case-insensitive on whole words ("El Niño" = "El Nino").

